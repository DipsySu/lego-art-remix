<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Art Remix — Lego mosaic studio</title>
    <meta
      name="description"
      content="Turn a photo into a Lego stud mosaic using the pieces from a set you already own. Everything runs in the browser. 把照片变成乐高颗粒马赛克，图片只留在浏览器里。"
    />
    <meta name="theme-color" content="#16130f" />
    <link rel="icon" href="/lego-art-remix/png/icon-192x192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,680&family=Noto+Sans+SC:wght@400;500;650&family=Outfit:wght@380;460;560;650&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        const saved = localStorage.getItem("art-remix-theme");
        const theme =
          saved ||
          (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.dataset.theme = theme;
      } catch (_error) {
        document.documentElement.dataset.theme = "dark";
      }
      try {
        const query = new URLSearchParams(location.search).get("lang");
        const stored = localStorage.getItem("art-remix-locale");
        const locale =
          query === "zh" || query === "en"
            ? query
            : stored === "zh" || stored === "en"
              ? stored
              : (navigator.language || "").toLowerCase().startsWith("zh")
                ? "zh"
                : "en";
        document.documentElement.lang = locale === "zh" ? "zh-CN" : "en";
        document.documentElement.dataset.locale = locale;
        document.title = locale === "zh" ? "Art Remix — 乐高马赛克工作台" : "Art Remix — Lego mosaic studio";
      } catch (_error) {
        document.documentElement.lang = "en";
      }
    </script>
    <script type="module" crossorigin src="/lego-art-remix/assets/index-DRcaN9As.js"></script>
    <link rel="stylesheet" crossorigin href="/lego-art-remix/assets/index-kZXoaN9n.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
